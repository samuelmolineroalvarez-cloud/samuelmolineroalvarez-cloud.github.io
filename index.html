<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Municipality employment statistics in Finland</title>
       <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="center">
        <h1>Municipality employment statistics in Finland</h1>
        <p id="status">Loading population and employment data...</p>

        <table>
            <thead>
                <tr>
                    <th scope="col">Municipality</th>
                    <th scope="col">Population</th>
                    <th scope="col">Employment amount</th>
                    <th scope="col">Employment-%</th>
                </tr>
            </thead>
            <tbody id="population-data"></tbody>
        </table>
    </div>
    <script src="script.js"></script>
</body>
</html>
